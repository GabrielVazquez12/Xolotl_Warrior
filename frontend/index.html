<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xolotl Warrior</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="ui-layer">
        <h1>Xolotl Warrior</h1>
        <p>A/D (move) | SHIFT (Run) | SPACE x2 (Fly) | K (Laser)</p>
    </div>

    <!-- HUD: lo rellena y actualiza js/hud.js. Los ids de aqui son los que
         ese archivo busca, asi que conviene no renombrarlos a la ligera. -->
    <div id="hud">
        <!-- Arriba al centro: como vas -->
        <div id="hud-marcador">
            <span class="hud-dato">Tiempo <b id="hud-tiempo">00:00</b></span>
            <span class="hud-dato">Puntos <b id="hud-puntos">0</b></span>
            <span class="hud-dato hud-record">Record <b id="hud-record">0</b></span>
        </div>

        <!-- Arriba a la derecha: cuanta vida queda -->
        <div id="hud-vidas">
            <span class="nucleo-hp">Nucleo <b id="hud-vida-nucleo"></b></span>
            <span class="fantasma-hp">Xolotl <b id="hud-vida-jugador"></b></span>
        </div>

        <!-- Abajo al centro: energia de la Ulti Espiritual (tecla E).
             Se llena 25% por cada enemigo, o sea 4 bajas = ulti lista. -->
        <div id="hud-energia">
            <span class="energia-etiqueta">Ulti</span>
            <div class="energia-barra">
                <div id="hud-energia-relleno"></div>
            </div>
            <b id="hud-energia-valor">0%</b>
        </div>

        <!-- Al centro: aviso pasajero (aparece y se desvanece solo) -->
        <div id="hud-aviso"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
